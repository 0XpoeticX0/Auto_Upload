name: Auto Upload Pipeline

on:
  schedule:
    # Runs at 6:40 AM and 7:40 PM your local time (00:40 and 13:40 UTC)
    - cron: '40 0,13 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip uninstall -y google-generativeai 2>/dev/null || true
        pip install -r requirements.txt
        # Force reinstall google-genai LAST so it wins the google namespace
        pip install --force-reinstall google-genai
        pip install --force-reinstall Pillow
        pip list | grep -E 'google|PIL|pillow'

    - name: Inject YouTube Tokens
      run: |
        echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
        echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secrets.json

    - name: Run Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      run: |
        python -m app.main
