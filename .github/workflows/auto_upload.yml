name: Auto Upload Pipeline

on:
  schedule:
    # Runs at 7:00 AM and 8:00 PM your local time (01:00 and 14:00 UTC)
    - cron: '0 1,14 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip list

    - name: Inject YouTube Tokens
      run: |
        echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
        echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secrets.json

    - name: Run Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      run: |
        python -m app.main
