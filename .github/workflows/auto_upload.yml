name: Auto Upload Bengali Video Pipeline

on:
  schedule:
    # 2 Daily Video Runs (15 min early, UTC+6):
    # 1. 6:45 AM Local (00:45 UTC) - Morning Short (for 7:00 AM)
    # 2. 7:45 PM Local (13:45 UTC) - Evening Short (for 8:00 PM)
    - cron: '45 0,13 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Full Static FFmpeg (BtbN with HarfBuzz & FriBidi)
      run: |
        wget -qO ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        tar -xf ffmpeg.tar.xz
        sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
        sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
        sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
        rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

    - name: Install System Bengali Fonts & Register Fontconfig
      run: |
        sudo apt-get update
        sudo apt-get install -y fontconfig fonts-beng fonts-noto-core fonts-noto-extra || true
        sudo mkdir -p /usr/local/share/fonts/bengali
        sudo cp app/assets/fonts/*.ttf /usr/local/share/fonts/bengali/
        sudo cp app/assets/fonts/fonts.conf /etc/fonts/local.conf
        sudo fc-cache -f -v
        echo "=== Verifying FFmpeg & FFprobe ==="
        ffmpeg -version | head -n 2
        ffprobe -version | head -n 1
        echo "=== Verifying Fonts Registered ==="
        fc-list : family | grep -iE 'noto|hind|amiri' || echo "WARNING: fonts not found!"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip uninstall -y google-generativeai 2>/dev/null || true
        pip install -r requirements.txt
        pip install --force-reinstall google-genai
        pip install --force-reinstall Pillow

    - name: Inject YouTube Tokens
      run: |
        echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
        echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secrets.json

    - name: Run Bengali Video Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_POST_API_KEY: ${{ secrets.GEMINI_POST_API_KEY || secrets.GEMINI_API_KEY }}
        GEMINI_BACKUP_API_KEY: ${{ secrets.GEMINI_BACKUP_API_KEY || 'AQ.Ab8RN6LXG-lJXSn7eLyJ80hTHHSaHlvS27etoOpw9xIJnRwnyg' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      run: |
        python -m app.main
