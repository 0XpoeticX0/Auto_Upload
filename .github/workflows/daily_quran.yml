name: Daily Quran Recitation Automation

on:
  schedule:
    # Runs at 00:00 UTC every day (06:00 AM Bangladesh Standard Time - BST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  daily-quran:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Full Static FFmpeg (BtbN with HarfBuzz & FriBidi)
        run: |
          wget -qO ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

      - name: Install System Bengali & Arabic Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-beng fonts-noto-core fonts-noto-extra || true
          sudo mkdir -p /usr/local/share/fonts/bengali
          sudo cp app/assets/fonts/*.ttf /usr/local/share/fonts/bengali/ || true
          sudo cp app/assets/fonts/fonts.conf /etc/fonts/local.conf || true
          sudo fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject Credentials & Secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON || secrets.TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON || secrets.CLIENT_SECRETS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
            echo "Restored .env"
          fi

          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > token.json
            echo "Restored token.json for YouTube upload"
          fi

          if [ -n "$YOUTUBE_CLIENT_SECRETS_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
            echo "Restored client_secrets.json"
          fi

          # If GEMINI_API_KEY was passed as individual secret, ensure it exists in .env
          if [ -n "$GEMINI_API_KEY" ] && ! grep -q "GEMINI_API_KEY=" .env 2>/dev/null; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi
          if [ -n "$GEMINI_API_KEYS" ] && ! grep -q "GEMINI_API_KEYS=" .env 2>/dev/null; then
            echo "GEMINI_API_KEYS=$GEMINI_API_KEYS" >> .env
          fi

      - name: Run Daily Quran Recitation Generator & Upload
        run: |
          python -m app.quran_verse.scheduler --upload
