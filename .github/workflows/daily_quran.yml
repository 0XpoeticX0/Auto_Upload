name: Daily Quran Recitation Automation

on:
  schedule:
    # Runs at 00:07 UTC every day (06:07 AM Bangladesh Standard Time - BST, Morning Prime Slot)
    - cron: '7 0 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  daily-quran:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Full Static FFmpeg (BtbN with HarfBuzz & FriBidi)
        run: |
          wget -qO ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

      - name: Install System Bengali & Arabic Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-beng fonts-noto-core fonts-noto-extra || true
          sudo mkdir -p /usr/local/share/fonts/bengali
          sudo cp app/assets/fonts/*.ttf /usr/local/share/fonts/bengali/ || true
          sudo cp app/assets/fonts/fonts.conf /etc/fonts/local.conf || true
          sudo fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt


      - name: Inject Credentials & Secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON || secrets.TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON || secrets.CLIENT_SECRETS_JSON }}
          TIKTOK_COOKIES_TXT: ${{ secrets.TIKTOK_COOKIES_TXT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_BACKUP_API_KEY: ${{ secrets.GEMINI_BACKUP_API_KEY }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
            echo "Restored .env"
          fi

          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > token.json
            echo "Restored token.json for YouTube upload"
          fi

          if [ -n "$YOUTUBE_CLIENT_SECRETS_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
            echo "Restored client_secrets.json"
          fi

          if [ -n "$TIKTOK_COOKIES_TXT" ]; then
            echo "$TIKTOK_COOKIES_TXT" > tiktok_cookies.txt
            echo "Restored tiktok_cookies.txt"
          fi

          # Ensure all platform environment variables are appended to .env if not already present
          [ -n "$GEMINI_API_KEY" ] && ! grep -q "GEMINI_API_KEY=" .env 2>/dev/null && echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          [ -n "$GEMINI_API_KEYS" ] && ! grep -q "GEMINI_API_KEYS=" .env 2>/dev/null && echo "GEMINI_API_KEYS=$GEMINI_API_KEYS" >> .env
          [ -n "$GEMINI_BACKUP_API_KEY" ] && ! grep -q "GEMINI_BACKUP_API_KEY=" .env 2>/dev/null && echo "GEMINI_BACKUP_API_KEY=$GEMINI_BACKUP_API_KEY" >> .env
          [ -n "$GEMINI_KEY_3" ] && ! grep -q "GEMINI_KEY_3=" .env 2>/dev/null && echo "GEMINI_KEY_3=$GEMINI_KEY_3" >> .env
          [ -n "$GEMINI_KEY_4" ] && ! grep -q "GEMINI_KEY_4=" .env 2>/dev/null && echo "GEMINI_KEY_4=$GEMINI_KEY_4" >> .env
          [ -n "$FB_ACCESS_TOKEN" ] && ! grep -q "FB_ACCESS_TOKEN=" .env 2>/dev/null && echo "FB_ACCESS_TOKEN=$FB_ACCESS_TOKEN" >> .env
          [ -n "$FB_PAGE_ID" ] && ! grep -q "FB_PAGE_ID=" .env 2>/dev/null && echo "FB_PAGE_ID=$FB_PAGE_ID" >> .env
          [ -n "$IG_USER_ID" ] && ! grep -q "IG_USER_ID=" .env 2>/dev/null && echo "IG_USER_ID=$IG_USER_ID" >> .env
          [ -n "$TIKTOK_ACCESS_TOKEN" ] && ! grep -q "TIKTOK_ACCESS_TOKEN=" .env 2>/dev/null && echo "TIKTOK_ACCESS_TOKEN=$TIKTOK_ACCESS_TOKEN" >> .env
          [ -n "$SUPABASE_URL" ] && ! grep -q "SUPABASE_URL=" .env 2>/dev/null && echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          [ -n "$SUPABASE_KEY" ] && ! grep -q "SUPABASE_KEY=" .env 2>/dev/null && echo "SUPABASE_KEY=$SUPABASE_KEY" >> .env
          [ -n "$HF_TOKEN" ] && ! grep -q "HF_TOKEN=" .env 2>/dev/null && echo "HF_TOKEN=$HF_TOKEN" >> .env
          echo "Successfully configured all environment secrets."

      - name: Run Daily Quran Recitation Generator & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_BACKUP_API_KEY: ${{ secrets.GEMINI_BACKUP_API_KEY }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m app.quran_verse.scheduler --upload

      - name: Persist Video Rotation State & History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/video_rotation_state.json data/history_log.json data/stock_video_catalog.json data/catalog_rejected_clips.json || true
          git commit -m "chore(automation): persist rotation state and history log [skip ci]" || true
          git push origin main || true

