name: Daily Facebook & Instagram Post Pipeline (Bangla)

on:
  schedule:
    # 4 Daily Bangla Post Runs (15 min early, UTC+6):
    # 1. 8:45 AM Local (02:45 UTC) - Morning Reflection (for 9:00 AM)
    - cron: '45 2 * * *'
    # 2. 12:45 PM Local (06:45 UTC) - Mid-day Peak (for 1:00 PM)
    - cron: '45 6 * * *'
    # 3. 4:45 PM Local (10:45 UTC) - Afternoon Reminder (for 5:00 PM)
    - cron: '45 10 * * *'
    # 4. 8:45 PM Local (14:45 UTC) - Night Dhikr & Heart Softener (for 9:00 PM)
    - cron: '45 14 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab
    inputs:
      language:
        description: 'Select Post Language'
        required: true
        default: 'bangla'
        type: choice
        options:
          - bangla
          - english

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Full FFmpeg with HarfBuzz
      uses: FedericoCarboni/setup-ffmpeg@v3

    - name: Install System Bengali Fonts & Register Fontconfig
      run: |
        sudo apt-get update
        sudo apt-get install -y fontconfig fonts-beng fonts-noto-core fonts-noto-extra || true
        sudo mkdir -p /usr/local/share/fonts/bengali
        sudo cp app/assets/fonts/*.ttf /usr/local/share/fonts/bengali/
        sudo cp app/assets/fonts/fonts.conf /etc/fonts/local.conf
        sudo fc-cache -f -v
        echo "=== Verifying FFmpeg & FFprobe ==="
        ffmpeg -version | head -n 2
        ffprobe -version | head -n 1
        echo "=== Verifying Fonts Registered ==="
        fc-list : family | grep -iE 'noto|hind|amiri' || echo "WARNING: fonts not found!"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip uninstall -y google-generativeai 2>/dev/null || true
        pip install -r requirements.txt
        pip install --force-reinstall google-genai
        pip install --force-reinstall Pillow

    - name: Run Bangla Facebook & Instagram Post Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_POST_API_KEY: ${{ secrets.GEMINI_POST_API_KEY || secrets.GEMINI_API_KEY }}
        GEMINI_BACKUP_API_KEY: ${{ secrets.GEMINI_BACKUP_API_KEY || 'AQ.Ab8RN6LXG-lJXSn7eLyJ80hTHHSaHlvS27etoOpw9xIJnRwnyg' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        IG_USER_ID: ${{ secrets.IG_USER_ID || '17841436824022360' }}
      run: |
        python -m app.post_main --lang "${{ inputs.language || 'bangla' }}"
