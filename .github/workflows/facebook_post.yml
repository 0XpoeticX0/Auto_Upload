name: Daily Facebook Post Pipeline

on:
  schedule:
    # Runs at 12:55 PM local time (06:55 UTC) — 5 minutes before peak 1:00 PM engagement window
    - cron: '55 6 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip uninstall -y google-generativeai 2>/dev/null || true
        pip install -r requirements.txt
        pip install --force-reinstall google-genai
        pip install --force-reinstall Pillow

    - name: Run Facebook Post Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      run: |
        python -m app.post_main
