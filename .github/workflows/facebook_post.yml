name: Daily Facebook & Instagram Post Pipeline

on:
  schedule:
    # 4-Post Daily Timeline (5 minutes early start, UTC+6):
    # 1. 8:25 AM Local (02:25 UTC) - Commute / Early Start
    - cron: '25 2 * * *'
    # 2. 12:25 PM Local (06:25 UTC) - Mid-day Peak Lunch Hour
    - cron: '25 6 * * *'
    # 3. 3:55 PM Local (09:55 UTC) - Afternoon Slump / Pre-Clockout
    - cron: '55 9 * * *'
    # 4. 8:25 PM Local (14:25 UTC) - Prime-time Evening Wind-down
    - cron: '25 14 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip uninstall -y google-generativeai 2>/dev/null || true
        pip install -r requirements.txt
        pip install --force-reinstall google-genai
        pip install --force-reinstall Pillow

    - name: Run Facebook & Instagram Post Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_POST_API_KEY: ${{ secrets.GEMINI_POST_API_KEY || secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        IG_USER_ID: ${{ secrets.IG_USER_ID || '17841436824022360' }}
      run: |
        python -m app.post_main
