name: 🌙 Daily Evening Hadith Loop Reel Pipeline (Bangla)

on:
  schedule:
    # 1 Daily Evening Hadith Loop Reel (Shifted 2h earlier to 05:30 PM BST / 11:30 UTC):
    # Evening Slot: 05:30 PM BST (11:30 UTC) -> Compensates for GitHub queue delays so video is live before 8 PM
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Specific Slot to Run (slot_2_evening, slot_1_morning, or auto)'
        required: false
        default: 'slot_2_evening'


jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Full Static FFmpeg (BtbN with HarfBuzz & FriBidi)
      run: |
        wget -qO ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        tar -xf ffmpeg.tar.xz
        sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
        sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
        sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
        rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

    - name: Install System Bengali Fonts & Register Fontconfig
      run: |
        sudo apt-get update
        sudo apt-get install -y fontconfig fonts-beng fonts-noto-core fonts-noto-extra || true
        sudo mkdir -p /usr/local/share/fonts/bengali
        sudo cp app/assets/fonts/*.ttf /usr/local/share/fonts/bengali/
        sudo cp app/assets/fonts/fonts.conf /etc/fonts/local.conf
        sudo fc-cache -f -v

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --force-reinstall Pillow

    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium

    - name: Inject Platform Tokens
      run: |
        echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
        echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secrets.json
        echo '${{ secrets.TIKTOK_COOKIES_TXT }}' > tiktok_cookies.txt

    - name: Run 4-Slot Loop Reel Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_POST_API_KEY: ${{ secrets.GEMINI_POST_API_KEY || secrets.GEMINI_API_KEY }}
        GEMINI_BACKUP_API_KEY: ${{ secrets.GEMINI_BACKUP_API_KEY || 'AQ.Ab8RN6LXG-lJXSn7eLyJ80hTHHSaHlvS27etoOpw9xIJnRwnyg' }}
        GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 || 'AQ.Ab8RN6K4etu26VDAdgGRxFJYOOHWUaG_KNF8-8608wxh608pCA' }}
        GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 || 'AQ.Ab8RN6IqbrtQWlwYwelnZlhfyaYeSksaf_PXSnhRTok40Mfbaw' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://tvezntceubxaqvcicyyc.supabase.co' }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZXpudGNldWJ4YXF2Y2ljeXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTg0NjgsImV4cCI6MjA5OTMzNDQ2OH0.sx5A6WT54mQUqqMDvrDZqo-mCURidOpVri-j7JFekq0' }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        IG_USER_ID: ${{ secrets.IG_USER_ID || '17841436824022360' }}
        TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      run: |
        SLOT_ARG="${{ github.event.inputs.slot }}"
        if [ "$SLOT_ARG" = "auto" ] || [ -z "$SLOT_ARG" ]; then
          python -m app.loop_reel.generator
        else
          python -m app.loop_reel.generator "$SLOT_ARG"
        fi
