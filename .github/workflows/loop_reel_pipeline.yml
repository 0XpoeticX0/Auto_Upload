name: 🌙 Daily Evening Hadith Loop Reel Pipeline (Bangla)

on:
  workflow_dispatch: # Manual trigger only (Scheduled runs disabled)
    inputs:
      slot:
        description: 'Specific Slot to Run (slot_2_evening, slot_1_morning, or auto)'
        required: false
        default: 'slot_2_evening'


jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Full Static FFmpeg (BtbN with HarfBuzz & FriBidi)
      run: |
        wget -qO ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        tar -xf ffmpeg.tar.xz
        sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
        sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
        sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
        rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

    - name: Install System Bengali Fonts & Register Fontconfig
      run: |
        sudo apt-get update
        sudo apt-get install -y fontconfig fonts-beng fonts-noto-core fonts-noto-extra || true
        sudo mkdir -p /usr/local/share/fonts/bengali
        sudo cp app/assets/fonts/*.ttf /usr/local/share/fonts/bengali/
        sudo cp app/assets/fonts/fonts.conf /etc/fonts/local.conf
        sudo fc-cache -f -v

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --force-reinstall Pillow

    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium

    - name: Inject Platform Tokens
      run: |
        echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
        echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secrets.json
        echo '${{ secrets.TIKTOK_COOKIES_TXT }}' > tiktok_cookies.txt

    - name: Run 4-Slot Loop Reel Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_POST_API_KEY: ${{ secrets.GEMINI_POST_API_KEY || secrets.GEMINI_API_KEY }}
        GEMINI_BACKUP_API_KEY: ${{ secrets.GEMINI_BACKUP_API_KEY }}
        GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
        GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
        TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      run: |
        SLOT_ARG="${{ github.event.inputs.slot }}"
        if [ "$SLOT_ARG" = "auto" ] || [ -z "$SLOT_ARG" ]; then
          python -m app.loop_reel.generator
        else
          python -m app.loop_reel.generator "$SLOT_ARG"
        fi
